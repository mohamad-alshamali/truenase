<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الصور</title>
<style>
  body { text-align: center; font-family: Arial; }
  img {
  width: 80%;
  max-width: 800px;
  height: auto;
} }
  button { padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>

<h1>صور المشروع</h1>

<img id="gallery" src="images/img(1).png">

<br>
<button onclick="nextImage()">التالي</button>

<br><br>
<a href="index.html">العودة للرئيسية</a>

<script>
let current = 1;
let totalImages = 70; // 👈 غيّر الرقم حسب عدد الصور

function nextImage() {
  current++;
  if (current > totalImages) {
    current = 1;
  }
  document.getElementById("gallery").src = "images/img(" + current + ").png";
}
</script>

</body>
</html>
